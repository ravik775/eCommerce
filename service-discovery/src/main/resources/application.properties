spring.application.name=service-discovery
# Was a non-optional import: if config-server was briefly unreachable,
# Eureka (the service registry everything else depends on) would refuse to
# start at all — a real backwards-dependency risk. Made optional to match
# bootstrap.yml and because Eureka's own critical config (port) already has
# a safe default in service-discovery.yaml.
spring.config.import=optional:configserver:http://localhost:8888
