# ADR-0004: Postgres, schema-per-service. Local dev credential only — see
# order-service.yml's header comment for the full note.
server:
  port: 8087

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8086/eureka/

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce?currentSchema=notification_service
    username: ecommerce_dev
    password: ${POSTGRES_PASSWORD:changeme-postgres-dev}
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        default_schema: notification_service
  flyway:
    schemas: notification_service
    create-schemas: true
    baseline-on-migrate: true

# ADR-0003: RabbitMQ topology for notification dispatch (declared as beans
# in RabbitMqConfig — names centralized here for reference).
notification:
  rabbitmq:
    dispatch-queue: notification.dispatch
    dispatch-exchange: notification.exchange
    dispatch-dlq: notification.dispatch.dlq
    dispatch-dlx: notification.dispatch.dlx
