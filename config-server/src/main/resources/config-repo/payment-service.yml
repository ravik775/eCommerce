# ADR-0004: Postgres, schema-per-service. Local dev credential only — see
# order-service.yml's header comment for the full note.
server:
  port: 8085

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:8086/eureka/

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/ecommerce?currentSchema=payment_service
    username: ecommerce_dev
    password: PRMbIw12h6JxrkkIruKqh65g
    driver-class-name: org.postgresql.Driver
  jpa:
    properties:
      hibernate:
        default_schema: payment_service
  flyway:
    schemas: payment_service
    create-schemas: true
    baseline-on-migrate: true

# Resilience4j config for OrderServiceClient's sync order-amount lookup —
# the one remaining synchronous cross-service call in the choreography
# saga (ADR-0007), guarded per the original Phase 2 Resilience4j intent.
resilience4j:
  circuitbreaker:
    instances:
      orderServiceLookup:
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 3
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
  retry:
    instances:
      orderServiceLookup:
        maxAttempts: 3
        waitDuration: 500ms
