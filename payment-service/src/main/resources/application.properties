spring.application.name=payment-service
spring.config.import=optional:configserver:http://localhost:8888

# ServiceTokenProvider: client-credentials token for the one outbound
# call payment-service makes (OrderServiceClient -> order-service).
# KEYCLOAK_TOKEN_URI matches the internal (container-to-container)
# address api-gateway already uses for the same purpose, not the
# browser-facing localhost:8090 one - this call never goes through a
# browser.
payment-service.order-service-client.token-uri=${KEYCLOAK_TOKEN_URI:http://keycloak:8080/realms/ecom/protocol/openid-connect/token}
payment-service.order-service-client.client-id=payment-service
payment-service.order-service-client.client-secret=${PAYMENT_SERVICE_CLIENT_SECRET:payment-service-dev-secret-CHANGE-IN-REAL-DEPLOYMENT}
