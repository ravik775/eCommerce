# CI pipeline. Full rationale/evidence: doc/adr/ADR-0010-cicd-pipeline-sast-dast.md
# and doc/adr/ADR-0011-artifact-packaging-zip.md.
#
# Stages: build -> test -> SAST (CodeQL) -> SCA (OWASP Dependency-Check) ->
# image-scan (Trivy, ADR-0019) -> package (zip, ADR-0011) -> DAST (OWASP
# ZAP, advisory-only until Phase 4 per ADR-0010, since there are no real
# authenticated endpoints to scan yet).
#
# No stage pushes an artifact anywhere (no registry, no repository) — the
# release zip is retained only as a workflow-run artifact. Pushing is a
# deliberately deferred, separate decision (ADR-0010).
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read
  security-events: write # required for CodeQL SARIF upload

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Reuses gitleaks' own default detection rules (see .gitleaks.toml)
      # rather than hand-rolling regex patterns — the OSS CLI directly,
      # not the GitHub-marketplace Action, since that requires a paid
      # license for private repos; the CLI itself is free regardless.
      # --no-git: scans the checked-out working tree's current content,
      # not git history — a secret that was committed and later removed
      # (like the plaintext Postgres password this repo actually had,
      # see doc/architecture/12-secrets-management.md) stays out of
      # scope for this gate. Full-history scanning found it correctly
      # but would then fail every future CI run forever on an
      # already-fixed historical commit, since purging git history is a
      # separate, far riskier decision than this gate's job. Test
      # fixtures (dummy data) and Sealed Secrets ciphertext (safe by
      # design, high-entropy by nature) are excluded via
      # .gitleaks.toml's allowlist, not by skipping paths here.
      - name: gitleaks detect
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source /repo --config /repo/.gitleaks.toml --no-git --redact -v

  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # This repo is developed on Windows, where git doesn't track the Unix
      # executable bit — `./mvnw` would otherwise fail with "Permission
      # denied" on the first run on this ubuntu-latest runner.
      - name: Ensure mvnw is executable
        run: chmod +x ./mvnw

      # ADR-0002: build + install common-lib (including the future
      # spiffe-mtls module) before dependent services, same as any
      # multi-module Maven project.
      - name: Build (all 10 modules)
        run: ./mvnw -B clean install -DskipTests

      - name: Unit + integration tests
        run: ./mvnw -B verify

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/target/surefire-reports/**"
          retention-days: 7

  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # This repo is developed on Windows, where git doesn't track the Unix
      # executable bit — `./mvnw` would otherwise fail with "Permission
      # denied" on the first run on this ubuntu-latest runner.
      - name: Ensure mvnw is executable
        run: chmod +x ./mvnw

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java

      - name: Build for CodeQL
        run: ./mvnw -B clean install -DskipTests

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3

  sca:
    name: SCA (OWASP Dependency-Check)
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # This repo is developed on Windows, where git doesn't track the Unix
      # executable bit — `./mvnw` would otherwise fail with "Permission
      # denied" on the first run on this ubuntu-latest runner.
      - name: Ensure mvnw is executable
        run: chmod +x ./mvnw

      # Invoked directly by full coordinates so no per-module pom.xml needs
      # the plugin declared — one aggregate report across the reactor.
      - name: OWASP Dependency-Check (aggregate)
        run: >
          ./mvnw -B org.owasp:dependency-check-maven:12.1.0:aggregate
          -DfailBuildOnCVSS=8
          -Dformats=HTML,SARIF

      - name: Upload Dependency-Check report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*
          retention-days: 7

  image-scan:
    name: Image scan (Trivy)
    runs-on: ubuntu-latest
    needs: build-and-test
    strategy:
      matrix:
        # Every service with a Dockerfile as of Phase 5/6 — ADR-0019's
        # own follow-up ("wire in Trivy once Dockerfiles exist") was
        # never actually done despite the Dockerfiles landing; closing
        # that gap here. config-server and service-discovery included
        # for completeness even though they aren't part of the
        # k8s/base runtime footprint reviewed elsewhere.
        service:
          - api-gateway
          - catalog-service
          - config-server
          - inventory-service
          - notification-service
          - order-service
          - payment-service
          - service-discovery
          - user-service
          - ui
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Ensure mvnw is executable
        run: chmod +x ./mvnw

      - name: Build image
        run: docker build -t "${{ matrix.service }}:${{ github.sha }}" -f "${{ matrix.service }}/Dockerfile" .

      # Pinned to a full commit SHA, not a version tag like every other
      # action in this file — deliberately inconsistent with this repo's
      # usual tag-pinning convention. Evidence, not just general best
      # practice: aquasecurity/trivy-action itself suffered a real
      # supply-chain compromise in March 2026 (credential-stealer
      # injected into every tag from 0.0.1 through 0.34.2 — see
      # https://www.stepsecurity.io/blog/trivy-compromised-a-second-time---malicious-v0-69-4-release
      # and https://thehackernews.com/2026/03/trivy-security-scanner-github-actions.html).
      # A floating tag on exactly this action would have silently
      # pulled the compromised version. SHA below is v0.36.0's verified
      # commit (ed142fd, confirmed via GitHub's commit API,
      # 2026-04-22) — the first release after the incident.
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: "${{ matrix.service }}:${{ github.sha }}"
          format: "sarif"
          output: "trivy-${{ matrix.service }}.sarif"
          # HIGH/CRITICAL only, matching ADR-0010's SCA gating policy
          # (-DfailBuildOnCVSS=8) rather than failing on every LOW
          # finding — calibrated to what's actually remediable, per
          # current (2026) guidance on avoiding alert fatigue.
          severity: "HIGH,CRITICAL"
          # Ignores CVEs with no available fix yet (nothing to action on
          # today) rather than blocking the pipeline on them — current
          # (2026) Trivy CI guidance; tracked separately, not silently
          # dropped, via the uploaded SARIF report below.
          ignore-unfixed: true
          exit-code: "1"

      - name: Upload Trivy SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-${{ matrix.service }}-sarif
          path: trivy-${{ matrix.service }}.sarif
          retention-days: 14

  package:
    name: Package (release zip)
    runs-on: ubuntu-latest
    needs: [sast, sca, image-scan]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # This repo is developed on Windows, where git doesn't track the Unix
      # executable bit — `./mvnw` would otherwise fail with "Permission
      # denied" on the first run on this ubuntu-latest runner.
      - name: Ensure mvnw is executable
        run: chmod +x ./mvnw

      # ADR-0011: executable JAR wrapped in a release ZIP per service.
      # WAR remains available via `-Pwar` if ever needed, not built here.
      - name: Build release zips
        run: ./mvnw -B clean package -DskipTests

      - name: Collect release zips
        run: |
          mkdir -p dist
          find . -path "*/target/*-release.zip" -exec cp {} dist/ \;
          ls -la dist/

      # Workflow-run artifact only — NOT pushed to a registry or artifact
      # repository. See ADR-0010 "Follow-up required".
      - name: Upload release zips (workflow artifact only, not published)
        uses: actions/upload-artifact@v4
        with:
          name: release-zips
          path: dist/*.zip
          retention-days: 14

  dast:
    name: DAST (OWASP ZAP, advisory)
    runs-on: ubuntu-latest
    needs: package
    # Advisory-only until Phase 4 (real auth boundary exists to scan
    # meaningfully) per ADR-0010 — failures here do not fail the pipeline yet.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # This repo is developed on Windows, where git doesn't track the Unix
      # executable bit — `./mvnw` would otherwise fail with "Permission
      # denied" on the first run on this ubuntu-latest runner.
      - name: Ensure mvnw is executable
        run: chmod +x ./mvnw

      # config-server is the smallest service that boots standalone (no
      # Eureka/DB/broker dependency), making it the current best DAST
      # target. Widens to the full stack once Phase 5's docker-compose
      # exists to bring everything up together.
      - name: Start config-server
        run: |
          ./mvnw -q -pl config-server spring-boot:run &
          echo $! > config-server.pid
          for i in $(seq 1 30); do
            curl -sf http://localhost:8888/actuator/health && break
            sleep 2
          done

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: "http://localhost:8888"
          rules_file_name: ".github/zap/rules.tsv"
          cmd_options: "-a"

      - name: Stop config-server
        if: always()
        run: kill "$(cat config-server.pid)" || true
