<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>eCommerce</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header>
    <h1>eCommerce</h1>
    <div id="user-menu">
      <button id="user-menu-btn" aria-haspopup="true" aria-expanded="false">
        <span id="whoami">Loading…</span> ▾
      </button>
      <div id="user-menu-dropdown" hidden>
        <div class="user-menu-item user-menu-submenu-trigger" id="roles-menu-trigger">
          Roles ▸
          <ul id="roles-menu-list" class="user-menu-submenu"></ul>
        </div>
        <!-- ADR-0032: only shown at all for a session with CAN_TRACE —
             hidden, not just disabled, same client-side-convenience
             pattern as the role-gated tabs (real enforcement is the
             header ForceTraceFilter/CorrelationTraceGatewayFilter check
             on the backend). -->
        <div class="user-menu-item user-menu-submenu-trigger" id="settings-menu-trigger" hidden>
          Settings ▸
          <ul class="user-menu-submenu">
            <li>
              <label>
                <input type="checkbox" id="force-trace-toggle" />
                Detail Trace
              </label>
            </li>
          </ul>
        </div>
        <!-- ADR-0047: always shown, never disabled — see that ADR for
             why: Keycloak's own Account Console already correctly
             handles both "no password credential yet" (lets the user
             set one) and "password exists" (lets them change it), so
             there is no local state to check before showing this link.
             Opens in a new tab since it's a genuinely separate app
             (Keycloak's own UI), not a route this SPA owns. -->
        <a class="user-menu-item" id="reset-password-link"
           href="http://localhost:8090/realms/ecom/account/"
           target="_blank" rel="noopener">Reset Password</a>
        <a class="user-menu-item" id="logout-link" href="/logout">Logout</a>
      </div>
    </div>
  </header>

  <!-- Role-based tabs (not flat): "Shop" is every authenticated user's
       home tab; "My Products"/"Admin" only exist as nav entries at all
       for a session that actually has PROVIDER/ADMIN — hidden, not just
       disabled, same as the sections they replace used to be. Client-side
       only, for navigation convenience: the real enforcement is still the
       gateway's RequireRole filter plus each service's own @PreAuthorize
       + ownership checks. -->
  <nav id="tabs">
    <button class="tab-btn active" data-tab="shop">Shop</button>
    <button class="tab-btn" data-tab="orders">My Orders</button>
    <button class="tab-btn" data-tab="provider" id="tab-btn-provider" hidden>My Products</button>
    <button class="tab-btn" data-tab="admin" id="tab-btn-admin" hidden>Admin</button>
  </nav>

  <main>
    <section id="tab-shop" class="tab-panel active">
      <div class="shop-grid">
        <div id="catalog">
          <h2>Catalog</h2>
          <input id="search" type="text" placeholder="Search products…" />
          <ul id="products"></ul>
          <div id="products-pager"></div>
        </div>

        <div id="cart">
          <h2>Cart</h2>
          <ul id="cart-items"></ul>
          <p>Total: $<span id="cart-total">0.00</span></p>
          <button id="checkout" disabled>Checkout</button>
          <p id="checkout-status"></p>
        </div>
      </div>
    </section>

    <!-- ADR-0031: minimal order history — status only, no cancel/return
         actions and no per-order line-item drill-down (deliberate scope
         line, see the ADR). Own tab + pagination, same pattern as the
         product catalog's. -->
    <section id="tab-orders" class="tab-panel">
      <h2>My Orders</h2>
      <ul id="order-list"></ul>
      <div id="orders-pager"></div>
    </section>

    <section id="tab-provider" class="tab-panel">
      <h2>My Products</h2>
      <form id="provider-form">
        <input id="p-name" type="text" placeholder="Name" required />
        <input id="p-description" type="text" placeholder="Description" />
        <input id="p-price" type="number" step="0.01" min="0" placeholder="Price" required />
        <input id="p-quantity" type="number" min="0" placeholder="Initial quantity" required />
        <button type="submit">Add Product</button>
      </form>
      <p id="provider-status"></p>
      <ul id="provider-products"></ul>
    </section>

    <section id="tab-admin" class="tab-panel">
      <h2>Restock</h2>
      <form id="restock-form">
        <input id="r-product-id" type="number" placeholder="Product ID" required />
        <input id="r-quantity" type="number" min="1" placeholder="Quantity to add" required />
        <button type="submit">Add Stock</button>
      </form>
      <p id="restock-status"></p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
