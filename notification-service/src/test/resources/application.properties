# Test-only overrides so `mvn test` is hermetic (no live config-server,
# Postgres, or Eureka required). See pom.xml's h2 dependency comment and
# doc/architecture/10-development-testing-deployment.md.
spring.cloud.config.enabled=false
spring.datasource.url=jdbc:h2:mem:notificationdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
eureka.client.enabled=false
spring.kafka.listener.auto-startup=false
spring.rabbitmq.listener.simple.auto-startup=false
# ADR-0025: jwk-set-uri (not issuer-uri) avoids the eager OIDC-discovery
# HTTP call at bean-creation time — see order-service's test properties
# comment for the full explanation. notification-service picked up
# common-lib's SecurityAutoConfiguration transitively (correlation-ID
# dependency) even though it has no HTTP endpoints of its own to protect.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/unused-in-hermetic-test/jwks
