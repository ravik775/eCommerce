# Test-only overrides so `mvn test` is hermetic (no live config-server or
# Postgres required). See pom.xml's h2 dependency comment and
# doc/architecture/10-development-testing-deployment.md.
spring.cloud.config.enabled=false
spring.datasource.url=jdbc:h2:mem:inventorydb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=none
spring.flyway.enabled=false
eureka.client.enabled=false
spring.kafka.listener.auto-startup=false
# ADR-0025: jwk-set-uri (not issuer-uri) avoids the eager OIDC-discovery
# HTTP call NimbusJwtDecoder makes at bean-creation time from issuer-uri —
# issuer-uri would fail context startup with no live Keycloak in this test.
# jwk-set-uri only fetches keys lazily, on an actual token decode, which
# never happens in this contextLoads-only test.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/unused-in-hermetic-test/jwks
