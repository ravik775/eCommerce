# Deliberately separate from k8s/base/kustomization.yaml: that file sets
# a global `namespace: ecom`, which would override every resource here's
# own `namespace: spire`/cluster-scoped RBAC. Apply with:
#   kubectl apply -k k8s/base/spire
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - namespace.yaml
  - server.yaml
  - agent.yaml
  - csi-driver.yaml
# Registration entries are NOT applied via kustomize/a K8s Job — see
# scripts/spire-register.sh and its header comment for why (the
# ghcr.io/spiffe/spire-server image is fully distroless, no shell, so a
# Job running shell logic against it can never work at all).
