apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: ecom
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: inventory-service }
  template:
    metadata:
      labels: { app: inventory-service }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: inventory-service
          image: ecomd-inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8084 }, { containerPort: 9084 }]
          envFrom:
            - configMapRef: { name: common-config }
            - secretRef: { name: app-datasource-secret }
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://host.docker.internal:5432/ecommerce?currentSchema=inventory_service" }
            - { name: SERVER_PORT, value: "8084" }
            # Phase 7: actuator/Prometheus on a separate plain-HTTP port
            # — see catalog-service.yaml for the full rationale.
            - { name: MANAGEMENT_SERVER_PORT, value: "9084" }
            # Keeps JVM heap inside the container's memory limit below —
            # same reasoning as the Dockerfile's JAVA_TOOL_OPTIONS, but
            # explicit here since the K8s memory limit (not the
            # container's cgroup default) is the real ceiling now.
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75.0" }
            # ADR-0002: enables common-lib's SPIFFE mTLS auto-config —
            # inbound Tomcat connector now requires a client SVID.
            - { name: SPIFFE_MTLS_ENABLED, value: "true" }
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            # ADR-0058: see order-service.yaml's identical comment — same
            # CPU-throttling-during-cold-start finding applies uniformly.
            limits: { cpu: 1000m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            # ADR-0020 claimed "restricted" Pod Security Standard but
            # never actually set this — closing that gap. Needs an
            # explicit writable /tmp (below): Tomcat's embedded work
            # dir and the JVM's default java.io.tmpdir both write
            # there; Spring Boot itself writes no other files at
            # runtime (stdout-only logging, no file appender).
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: spiffe-workload-api, mountPath: /spiffe-workload-api, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            tcpSocket: { port: 8084 }
            initialDelaySeconds: 100
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8084 }
            # ADR-0058: see order-service.yaml's identical comment.
            initialDelaySeconds: 300
            periodSeconds: 20
            failureThreshold: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: inventory-service
  namespace: ecom
spec:
  selector: { app: inventory-service }
  ports: [{ name: http, port: 8084, targetPort: 8084 }, { name: metrics, port: 9084, targetPort: 9084 }]
