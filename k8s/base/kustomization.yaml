# NOTE: configMapGenerator below references ../../keycloak/ecom-realm.json
# (outside this directory tree) so the realm-as-code file has exactly one
# source of truth, shared with Docker Compose (docker-compose.yml mounts
# the same directory) — not duplicated into k8s/. Kustomize's default
# security sandbox blocks reading files outside the kustomization root,
# so building/applying this requires:
#   kubectl apply -k k8s/overlays/local --load-restrictor=LoadRestrictionsNone
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ecom
# postgres.yaml, kafka.yaml, keycloak.yaml are deliberately NOT listed
# here — see configmap-common.yaml's "LOCAL-DEV DEVIATION" comment. They
# remain in this directory as the correct target-state manifests for the
# real deployment (ADR-0022 still calls for Postgres in-cluster); re-add
# them to this list for that environment instead of writing them from
# scratch. On this dev machine, those three run as standalone Docker
# containers instead, to stay under available resources.
resources:
  - namespace.yaml
  - resource-limits.yaml
  - configmap-common.yaml
  - configmap-gateway-routes.yaml
  - secrets.yaml
  - rbac-secrets-publisher.yaml
  - rabbitmq.yaml
  - redis.yaml
  - user-service.yaml
  - order-service.yaml
  - catalog-service.yaml
  - inventory-service.yaml
  - payment-service.yaml
  - notification-service.yaml
  - api-gateway.yaml
  - ui.yaml
  - networkpolicy.yaml
  - prometheus.yaml
  - grafana.yaml
  - loki.yaml
# configMapGenerator for the Keycloak realm-import ConfigMap is removed
# along with keycloak.yaml above (Keycloak runs as a standalone host
# container locally, importing the realm via a direct volume mount
# instead — see the `docker run` command that started it). Restore both
# together when re-enabling in-cluster Keycloak.
