# ADR-0032: OpenTelemetry distributed tracing backend. Single-binary
# Tempo, local filesystem storage — same "smallest thing that actually
# works" sizing as Loki (k8s/base/loki.yaml), not a production
# multi-component Tempo deployment. Paired with a short block_retention
# matching this cluster's already-short observability retention posture
# (Prometheus is 6h — see k8s/base/prometheus.yaml) rather than pretending
# this dev cluster keeps traces indefinitely.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
  namespace: ecom
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            http:
    ingester:
      trace_idle_period: 10s
    compactor:
      compaction:
        block_retention: 6h
    storage:
      trace:
        backend: local
        local:
          path: /tmp/tempo/blocks
        wal:
          path: /tmp/tempo/wal
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  namespace: ecom
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: tempo }
  template:
    metadata:
      labels: { app: tempo }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: tempo
          image: grafana/tempo:2.6.1
          args: ["-config.file=/etc/tempo/tempo.yaml"]
          ports:
            - { containerPort: 3200 }
            - { containerPort: 4318 }
          volumeMounts:
            - { name: config, mountPath: /etc/tempo }
            - { name: data, mountPath: /tmp/tempo }
          resources:
            # Found live: Tempo's own internal distributor->ingester gRPC
            # pipeline (both run in this same single-binary process,
            # 127.0.0.1:9095) was timing out under the old 500m/512Mi
            # limit - "pusher failed to consume trace data ... code =
            # DeadlineExceeded" - meaning most spans from real requests
            # never made it into storage, and search queries (sharing the
            # same resource-starved process) returned "No data" even for
            # {} (match everything). Requests bumped modestly (node has
            # ample CPU-request headroom, ~35% memory-request headroom
            # per `kubectl describe node`); limits raised more generously
            # so Tempo can actually burst under this session's load
            # instead of being throttled into missing its own internal
            # health checks.
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: 1000m, memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /ready, port: 3200 }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /ready, port: 3200 }
            initialDelaySeconds: 15
            periodSeconds: 15
      volumes:
        - { name: config, configMap: { name: tempo-config } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: tempo
  namespace: ecom
spec:
  selector: { app: tempo }
  ports:
    - { name: http, port: 3200, targetPort: 3200 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
