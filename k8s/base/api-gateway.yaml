apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: ecom
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: api-gateway }
  template:
    metadata:
      labels: { app: api-gateway }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: api-gateway
          image: ecomd-api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: common-config }
            - secretRef: { name: gateway-oauth2-secret }
          env:
            - { name: SPRING_CONFIG_ADDITIONAL_LOCATION, value: "file:/config/" }
            - { name: SPRING_DATA_REDIS_HOST, value: "redis" }
            - { name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_ID, value: "ecommerce-gateway" }
            - { name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_AUTHORIZATION_GRANT_TYPE, value: "authorization_code" }
            - { name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_REDIRECT_URI, value: "{baseUrl}/login/oauth2/code/{registrationId}" }
            - { name: SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_SCOPE, value: "openid" }
            # Keycloak now runs as a standalone host container, not a K8s
            # pod (see configmap-common.yaml's local-dev-deviation note).
            # Browser-facing calls use localhost:8090 (host-mapped port);
            # this pod's own server-to-server calls (token exchange,
            # userinfo, jwks) use host.docker.internal:8090 — the same
            # dual-address split as before, just against a host container
            # instead of an in-cluster Service.
            - { name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_AUTHORIZATION_URI, value: "http://localhost:8090/realms/ecom/protocol/openid-connect/auth" }
            - { name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_TOKEN_URI, value: "http://host.docker.internal:8090/realms/ecom/protocol/openid-connect/token" }
            - { name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_JWK_SET_URI, value: "http://host.docker.internal:8090/realms/ecom/protocol/openid-connect/certs" }
            - { name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_INFO_URI, value: "http://host.docker.internal:8090/realms/ecom/protocol/openid-connect/userinfo" }
            - { name: SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_USER_NAME_ATTRIBUTE, value: "sub" }
            # SecurityConfig's manual RP-initiated logout handler — same
            # browser-reachable-host reasoning as AUTHORIZATION_URI above,
            # not the SPRING_SECURITY_OAUTH2_CLIENT_PROVIDER_KEYCLOAK_*
            # binding tree (Spring only auto-discovers end_session_endpoint
            # via issuer-uri, which this deployment deliberately doesn't use).
            - { name: KEYCLOAK_LOGOUT_URI, value: "http://localhost:8090/realms/ecom/protocol/openid-connect/logout" }
            # ADR-0064: -javaagent added here, not baked into the image's
            # ENV JAVA_TOOL_OPTIONS, so this override lives with the rest
            # of this deployment's config rather than silently changing
            # behavior for anyone reusing the image directly.
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75.0 -javaagent:/otel/opentelemetry-javaagent.jar" }
            # ADR-0002: enables common-lib's SPIFFE mTLS auto-config —
            # this pod's proxy client now presents a client SVID and
            # verifies the peer's SVID on every outbound route call.
            - { name: SPIFFE_MTLS_ENABLED, value: "true" }
            # ADR-0064: the gateway is the only service where library
            # instrumentation (common-lib's TracingAutoConfiguration,
            # micrometer-tracing-bridge-otel) provably fails to export
            # spans for proxied routes (ADR-0055/ADR-0056/ADR-0063's live
            # findings) — switched to the OpenTelemetry Java agent here
            # only, not across all 5 services, since the other 4 are
            # already confirmed working under library instrumentation
            # and the agent adds real operational surface (startup
            # overhead, another artifact to version) not worth taking on
            # where nothing is broken.
            #
            # MANAGEMENT_TRACING_ENABLED=false overrides common-config's
            # "true" for this pod specifically — disables common-lib's
            # TracingAutoConfiguration AND Spring Boot Actuator's own
            # tracing auto-configuration (both gated by this same real
            # Spring Boot property), preventing an in-process OTel SDK
            # from registering as GlobalOpenTelemetry and conflicting
            # with the one the agent already installed at JVM bootstrap
            # (before the Spring context even starts) — OTel explicitly
            # does not support two SDKs both calling
            # GlobalOpenTelemetry.set(...) in the same JVM.
            - { name: MANAGEMENT_TRACING_ENABLED, value: "false" }
            - { name: OTEL_SERVICE_NAME, value: "api-gateway" }
            - { name: OTEL_TRACES_EXPORTER, value: "otlp" }
            # Same Tempo endpoint as MANAGEMENT_OTLP_TRACING_ENDPOINT in
            # common-config, but the agent wants the collector root (it
            # appends /v1/traces itself) and an explicit protocol, not
            # the full path common-lib's manual exporter config used.
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://tempo:4318" }
            - { name: OTEL_EXPORTER_OTLP_PROTOCOL, value: "http/protobuf" }
            # This project doesn't use OTel for metrics/logs (Prometheus
            # scraping + Loki cover those independently) — without this,
            # the agent would also try to export both via OTLP, which
            # nothing here consumes.
            - { name: OTEL_METRICS_EXPORTER, value: "none" }
            - { name: OTEL_LOGS_EXPORTER, value: "none" }
            # AlwaysOnSampler equivalent — see
            # otel-agent-extension's ForceTraceAndErrorSamplingExtension
            # Javadoc for why the export-time filter needs every span
            # actually recorded first.
            - { name: OTEL_TRACES_SAMPLER, value: "always_on" }
            - { name: OTEL_JAVAAGENT_EXTENSIONS, value: "/otel/otel-agent-extension.jar" }
            # Read by ForceTraceAndErrorSamplingExtension via OTel's
            # standard config-property naming convention (env var
            # OTEL_TRACES_SUCCESS_SAMPLE_RATE -> property key
            # otel.traces.success.sample.rate) — same value as
            # TRACING_SUCCESS_SAMPLE_RATE in common-config, kept in sync
            # by hand since the agent and common-lib read different
            # property namespaces.
            - { name: OTEL_TRACES_SUCCESS_SAMPLE_RATE, value: "0.1" }
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            # ADR-0058: see order-service.yaml's identical comment — same
            # CPU-throttling-during-cold-start finding applies uniformly.
            limits: { cpu: 1000m, memory: 512Mi }
          volumeMounts:
            - name: gateway-routes
              mountPath: /config
            - { name: spiffe-workload-api, mountPath: /spiffe-workload-api, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            # ADR-0020 claimed "restricted" Pod Security Standard but
            # never actually set this — closing that gap. Needs an
            # explicit writable /tmp (above): the JVM's default
            # java.io.tmpdir writes there; this service logs to
            # stdout only, no file appender.
            readOnlyRootFilesystem: true
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 100
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8080 }
            # ADR-0058: see order-service.yaml's identical comment.
            initialDelaySeconds: 300
            periodSeconds: 20
            failureThreshold: 5
      volumes:
        - name: gateway-routes
          configMap: { name: gateway-routes }
        - name: tmp
          emptyDir: {}
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: ecom
spec:
  selector: { app: api-gateway }
  ports: [{ port: 8080, targetPort: 8080 }]
