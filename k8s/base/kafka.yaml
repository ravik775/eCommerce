apiVersion: apps/v1
kind: Deployment
metadata:
  name: kafka
  namespace: ecom
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: kafka }
  template:
    metadata:
      labels: { app: kafka }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: kafka
          image: apache/kafka:3.9.0
          ports: [{ containerPort: 9092 }]
          env:
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_INTER_BROKER_LISTENER_NAME, value: "PLAINTEXT" }
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://kafka:9092" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@kafka:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
          # Validated against 2026 Strimzi/Red Hat KRaft sizing guidance
          # (controller-only: 500m/1Gi; broker-only: 1000m/2Gi) — this
          # process combines both roles (KAFKA_PROCESS_ROLES=broker,
          # controller) in one JVM, so sized between the two rather than
          # at either extreme, for single-node local dev.
          resources:
            requests: { cpu: 300m, memory: 768Mi }
            limits: { cpu: 750m, memory: 1536Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            exec: { command: ["/opt/kafka/bin/kafka-broker-api-versions.sh", "--bootstrap-server", "localhost:9092"] }
            periodSeconds: 10
            initialDelaySeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: kafka
  namespace: ecom
spec:
  selector: { app: kafka }
  ports: [{ port: 9092, targetPort: 9092 }]
