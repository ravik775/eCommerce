# Sealed with kubeseal (Bitnami Sealed Secrets, strict scope — the
# default: each SealedSecret is bound to its exact namespace+name, so
# copying this YAML to another namespace/name renders it permanently
# undecryptable). Safe to commit: only the sealed-secrets-controller's
# private key (never leaves the cluster) can decrypt these into real
# K8s Secret objects at apply time — see doc/architecture/12-secrets-management.md
# for the full access-control model and how to re-seal after rotating
# a credential.
#
# Regenerate after changing a value:
#   kubeseal --fetch-cert > pub-cert.pem
#   kubeseal --cert=pub-cert.pem --format=yaml < plaintext-secret.yaml > sealed.yaml
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: postgres-secret
  namespace: ecom
spec:
  encryptedData:
    POSTGRES_DB: 
    POSTGRES_PASSWORD: 
    POSTGRES_USER: 
  template:
    metadata:
      name: postgres-secret
      namespace: ecom
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: rabbitmq-secret
  namespace: ecom
spec:
  encryptedData:
    RABBITMQ_DEFAULT_PASS: 
    RABBITMQ_DEFAULT_USER: 
  template:
    metadata:
      name: rabbitmq-secret
      namespace: ecom
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
