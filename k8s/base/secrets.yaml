metadata:
  name: app-datasource-secret
  namespace: ecom
spec:
  encryptedData:
    SPRING_DATASOURCE_PASSWORD: 
    SPRING_DATASOURCE_USERNAME: 
    SPRING_RABBITMQ_PASSWORD: 
    SPRING_RABBITMQ_USERNAME: 
  template:
    metadata:
      name: app-datasource-secret
      namespace: ecom
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: gateway-oauth2-secret
  namespace: ecom
spec:
  encryptedData:
    SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_KEYCLOAK_CLIENT_SECRET: 
  template:
    metadata:
      name: gateway-oauth2-secret
      namespace: ecom
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
