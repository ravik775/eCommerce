apiVersion: apps/v1
kind: Deployment
metadata:
  name: user-service
  namespace: ecom
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: user-service }
  template:
    metadata:
      labels: { app: user-service }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: user-service
          image: ecomd-user-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8081 }, { containerPort: 9081 }]
          envFrom:
            - configMapRef: { name: common-config }
            - secretRef: { name: app-datasource-secret }
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://host.docker.internal:5432/ecommerce?currentSchema=user_service" }
            - { name: SERVER_PORT, value: "8081" }
            # Phase 7: actuator/Prometheus on a separate plain-HTTP port
            # — see catalog-service.yaml for the full rationale.
            - { name: MANAGEMENT_SERVER_PORT, value: "9081" }
            # Keeps JVM heap inside the container's memory limit below —
            # same reasoning as the Dockerfile's JAVA_TOOL_OPTIONS, but
            # explicit here since the K8s memory limit (not the
            # container's cgroup default) is the real ceiling now.
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75.0" }
            # ADR-0002: enables common-lib's SPIFFE mTLS auto-config —
            # inbound Tomcat connector now requires a client SVID.
            - { name: SPIFFE_MTLS_ENABLED, value: "true" }
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: spiffe-workload-api, mountPath: /spiffe-workload-api, readOnly: true }
          readinessProbe:
            tcpSocket: { port: 8081 }
            initialDelaySeconds: 100
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8081 }
            initialDelaySeconds: 220
            periodSeconds: 15
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: user-service
  namespace: ecom
spec:
  selector: { app: user-service }
  ports: [{ name: http, port: 8081, targetPort: 8081 }, { name: metrics, port: 9081, targetPort: 9081 }]
