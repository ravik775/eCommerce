# Phase 7: Grafana pre-provisioned with the Prometheus datasource + one
# starter dashboard (per-service request rate, latency, JVM heap) — auto-
# loaded via the provisioning ConfigMaps below, no manual click-through
# setup needed to get the "Grafana dashboard shows live per-service
# metrics" DoD item demonstrable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: ecom
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        jsonData:
          # ADR-0032: every log line already carries [...,traceId=X] via
          # LOGGING_PATTERN_LEVEL (k8s/base/configmap-common.yaml) — this
          # turns that substring into a clickable jump straight to the
          # matching Tempo trace, log -> trace direction.
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: "traceId=([a-f0-9-]+)"
              name: TraceID
              url: "$${__value.raw}"
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        jsonData:
          # Trace -> log direction: jump from a span straight to that
          # request's log lines in Loki, filtered by the same traceId.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            filterByTraceID: true
            customQuery: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: ecom
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ecom
  namespace: ecom
data:
  ecom-overview.json: |
    {
      "title": "eCommerce Services Overview",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1, "title": "HTTP request rate by service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [{ "expr": "sum by (application) (rate(http_server_requests_seconds_count[1m]))" }]
        },
        {
          "id": 2, "title": "p99 request latency by service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [{ "expr": "histogram_quantile(0.99, sum by (application, le) (rate(http_server_requests_seconds_bucket[5m])))" }]
        },
        {
          "id": 3, "title": "JVM heap used by service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [{ "expr": "sum by (application) (jvm_memory_used_bytes{area=\"heap\"})" }]
        },
        {
          "id": 4, "title": "Services up",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [{ "expr": "sum(up)" }]
        },
        {
          "id": 5, "title": "Orders per minute",
          "type": "timeseries",
          "description": "orders_total (ADR-0032), rate() over a 1m window. Zoom Grafana's time range picker (top right) to see the current peak window within the last 6h — that's this Prometheus instance's configured retention (--storage.tsdb.retention.time=6h, k8s/base/prometheus.yaml), a deliberate operational-monitoring tradeoff, not a bug. For peak-window analysis across a day/week/month/year (retrospective business analytics, not real-time ops), query order_service.orders directly by orderCreatedOn instead — Prometheus at this retention cannot answer that question, and pretending otherwise here would be misleading.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "targets": [{ "expr": "sum(rate(orders_total[1m])) * 60" }]
        }
      ]
    }
  order-trace-explorer.json: |
    {
      "title": "Order Trace Explorer",
      "description": "Enter EITHER an Order ID (e.g. 80) OR a Trace ID (appTraceId, e.g. a UUID like 07903a8e-ea81-...) into the single search box below - every panel matches on whichever field the value actually belongs to, via an OR condition, so you don't need to know in advance which kind of identifier you have. Order ID is the more commonly known value but api-gateway's own span never carries it (the gateway assigns nothing before order-service creates the row) - Trace ID (appTraceId, ADR-0052/0056) is stamped everywhere including the gateway, so searching by it is the only way to also filter the api-gateway panel. The Loki panel is still the most complete chronological cross-service view today (ADR-0056/0057 background: Tempo does not yet link all services into one shared trace tree).",
      "schemaVersion": 39,
      "templating": {
        "list": [
          {
            "name": "search",
            "type": "textbox",
            "label": "Order ID or Trace ID",
            "query": "",
            "current": { "text": "", "value": "" }
          }
        ]
      },
      "panels": [
        {
          "id": 7,
          "title": "Resolved Saga ID (appTraceId) — the authoritative cross-saga ID",
          "description": "Resolves whatever you searched (Order ID or Trace ID) to the canonical appTraceId, extracted from the first matching log line. This IS the value worth copying and reusing elsewhere (it's the same value the checkout UI now shows as 'Saga ID', ADR-0061) — orderId is a convenient lookup key into it, not a substitute for it. Empty means no log line matched $search at all (check the search value and time range) - the individual per-service panels below have their own, more specific 'not found' explanations.",
          "type": "table",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 4, "w": 24, "x": 0, "y": 0 },
          "transformations": [
            {
              "id": "extractFields",
              "options": {
                "source": "Line",
                "format": "regexp",
                "regex": "appTraceId=(?<appTraceId>[a-f0-9-]+)"
              }
            },
            {
              "id": "extractFields",
              "options": {
                "source": "Line",
                "format": "regexp",
                "regex": "orderId=(?<orderId>[0-9]+)"
              }
            },
            {
              "id": "organize",
              "options": {
                "includeByName": { "appTraceId": true, "orderId": true },
                "excludeByName": { "Time": true, "Line": true, "labels": true, "tsNs": true, "id": true, "app": true },
                "indexByName": { "appTraceId": 0, "orderId": 1 },
                "renameByName": { "appTraceId": "Saga ID (appTraceId)", "orderId": "Order ID" }
              }
            }
          ],
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{app=~\"api-gateway|order-service|inventory-service|payment-service|notification-service\"} |~ `orderId=$search]|appTraceId=$search,`",
              "maxLines": 1,
              "refId": "A"
            }
          ]
        },
        {
          "id": 1,
          "title": "Complete call history across all services (Loki, chronological)",
          "type": "logs",
          "datasource": { "type": "loki", "uid": "loki" },
          "gridPos": { "h": 10, "w": 24, "x": 0, "y": 4 },
          "options": { "sortOrder": "Ascending", "showTime": true, "wrapLogMessages": true },
          "targets": [
            {
              "datasource": { "type": "loki", "uid": "loki" },
              "expr": "{app=~\"api-gateway|order-service|inventory-service|payment-service|notification-service\"} |~ `orderId=$search]|appTraceId=$search,`",
              "refId": "A"
            }
          ]
        },
        {
          "id": 2,
          "title": "api-gateway span",
          "type": "traces",
          "description": "Only matches if you searched by Trace ID, not Order ID - the gateway never learns orderId (order-service assigns it after the gateway's span has already started), so an orderId search will always come up empty here even when the other panels find real data. Also still subject to a separately-tracked open gap: the gateway's span for authenticated/proxied routes (like POST /order) may not export to Tempo at all yet, even with a correct traceId - an empty panel here can mean either 'no matching trace was exported' or 'you searched by orderId', not necessarily a broken query.",
          "datasource": { "type": "tempo", "uid": "tempo" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 14 },
          "targets": [
            {
              "datasource": { "type": "tempo", "uid": "tempo" },
              "queryType": "traceql",
              "query": "{resource.service.name=\"api-gateway\" && (span.orderId=\"$search\" || span.appTraceId=\"$search\")}",
              "limit": 20,
              "tableType": "traces",
              "refId": "A"
            }
          ]
        },
        {
          "id": 3,
          "title": "order-service span",
          "type": "traces",
          "datasource": { "type": "tempo", "uid": "tempo" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 14 },
          "targets": [
            {
              "datasource": { "type": "tempo", "uid": "tempo" },
              "queryType": "traceql",
              "query": "{resource.service.name=\"order-service\" && (span.orderId=\"$search\" || span.appTraceId=\"$search\")}",
              "limit": 20,
              "tableType": "traces",
              "refId": "A"
            }
          ]
        },
        {
          "id": 4,
          "title": "inventory-service span (ADR-0057)",
          "type": "traces",
          "datasource": { "type": "tempo", "uid": "tempo" },
          "gridPos": { "h": 9, "w": 12, "x": 0, "y": 23 },
          "targets": [
            {
              "datasource": { "type": "tempo", "uid": "tempo" },
              "queryType": "traceql",
              "query": "{resource.service.name=\"inventory-service\" && (span.orderId=\"$search\" || span.appTraceId=\"$search\")}",
              "limit": 20,
              "tableType": "traces",
              "refId": "A"
            }
          ]
        },
        {
          "id": 5,
          "title": "payment-service span (ADR-0057)",
          "type": "traces",
          "datasource": { "type": "tempo", "uid": "tempo" },
          "gridPos": { "h": 9, "w": 12, "x": 12, "y": 23 },
          "targets": [
            {
              "datasource": { "type": "tempo", "uid": "tempo" },
              "queryType": "traceql",
              "query": "{resource.service.name=\"payment-service\" && (span.orderId=\"$search\" || span.appTraceId=\"$search\")}",
              "limit": 20,
              "tableType": "traces",
              "refId": "A"
            }
          ]
        },
        {
          "id": 6,
          "title": "notification-service span",
          "type": "traces",
          "datasource": { "type": "tempo", "uid": "tempo" },
          "gridPos": { "h": 9, "w": 24, "x": 0, "y": 32 },
          "targets": [
            {
              "datasource": { "type": "tempo", "uid": "tempo" },
              "queryType": "traceql",
              "query": "{resource.service.name=\"notification-service\" && (span.orderId=\"$search\" || span.appTraceId=\"$search\")}",
              "limit": 20,
              "tableType": "traces",
              "refId": "A"
            }
          ]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ecom
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          envFrom:
            - secretRef: { name: grafana-admin-secret }
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
          ports: [{ containerPort: 3000 }]
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboard-provisioning, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboard-ecom, mountPath: /var/lib/grafana/dashboards }
            - { name: data, mountPath: /var/lib/grafana }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: dashboard-provisioning, configMap: { name: grafana-dashboard-provisioning } }
        - { name: dashboard-ecom, configMap: { name: grafana-dashboard-ecom } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ecom
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
