# Phase 7: Grafana pre-provisioned with the Prometheus datasource + one
# starter dashboard (per-service request rate, latency, JVM heap) — auto-
# loaded via the provisioning ConfigMaps below, no manual click-through
# setup needed to get the "Grafana dashboard shows live per-service
# metrics" DoD item demonstrable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: ecom
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: ecom
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ecom
  namespace: ecom
data:
  ecom-overview.json: |
    {
      "title": "eCommerce Services Overview",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1, "title": "HTTP request rate by service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [{ "expr": "sum by (application) (rate(http_server_requests_seconds_count[1m]))" }]
        },
        {
          "id": 2, "title": "p99 request latency by service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [{ "expr": "histogram_quantile(0.99, sum by (application, le) (rate(http_server_requests_seconds_bucket[5m])))" }]
        },
        {
          "id": 3, "title": "JVM heap used by service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [{ "expr": "sum by (application) (jvm_memory_used_bytes{area=\"heap\"})" }]
        },
        {
          "id": 4, "title": "Services up",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [{ "expr": "sum(up)" }]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ecom
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          envFrom:
            - secretRef: { name: grafana-admin-secret }
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
          ports: [{ containerPort: 3000 }]
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboard-provisioning, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboard-ecom, mountPath: /var/lib/grafana/dashboards }
            - { name: data, mountPath: /var/lib/grafana }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: dashboard-provisioning, configMap: { name: grafana-dashboard-provisioning } }
        - { name: dashboard-ecom, configMap: { name: grafana-dashboard-ecom } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ecom
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
