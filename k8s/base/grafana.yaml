# Phase 7: Grafana pre-provisioned with the Prometheus datasource + one
# starter dashboard (per-service request rate, latency, JVM heap) — auto-
# loaded via the provisioning ConfigMaps below, no manual click-through
# setup needed to get the "Grafana dashboard shows live per-service
# metrics" DoD item demonstrable.
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: ecom
data:
  datasource.yml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
        jsonData:
          # ADR-0032: every log line already carries [...,traceId=X] via
          # LOGGING_PATTERN_LEVEL (k8s/base/configmap-common.yaml) — this
          # turns that substring into a clickable jump straight to the
          # matching Tempo trace, log -> trace direction.
          derivedFields:
            - datasourceUid: tempo
              matcherRegex: "traceId=([a-f0-9-]+)"
              name: TraceID
              url: "$${__value.raw}"
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        jsonData:
          # Trace -> log direction: jump from a span straight to that
          # request's log lines in Loki, filtered by the same traceId.
          tracesToLogsV2:
            datasourceUid: loki
            spanStartTimeShift: "-5m"
            spanEndTimeShift: "5m"
            filterByTraceID: true
            customQuery: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-provisioning
  namespace: ecom
data:
  dashboards.yml: |
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ''
        type: file
        options:
          path: /var/lib/grafana/dashboards
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-ecom
  namespace: ecom
data:
  ecom-overview.json: |
    {
      "title": "eCommerce Services Overview",
      "schemaVersion": 39,
      "panels": [
        {
          "id": 1, "title": "HTTP request rate by service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [{ "expr": "sum by (application) (rate(http_server_requests_seconds_count[1m]))" }]
        },
        {
          "id": 2, "title": "p99 request latency by service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [{ "expr": "histogram_quantile(0.99, sum by (application, le) (rate(http_server_requests_seconds_bucket[5m])))" }]
        },
        {
          "id": 3, "title": "JVM heap used by service",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [{ "expr": "sum by (application) (jvm_memory_used_bytes{area=\"heap\"})" }]
        },
        {
          "id": 4, "title": "Services up",
          "type": "stat",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [{ "expr": "sum(up)" }]
        },
        {
          "id": 5, "title": "Orders per minute",
          "type": "timeseries",
          "description": "orders_total (ADR-0032), rate() over a 1m window. Zoom Grafana's time range picker (top right) to see the current peak window within the last 6h — that's this Prometheus instance's configured retention (--storage.tsdb.retention.time=6h, k8s/base/prometheus.yaml), a deliberate operational-monitoring tradeoff, not a bug. For peak-window analysis across a day/week/month/year (retrospective business analytics, not real-time ops), query order_service.orders directly by orderCreatedOn instead — Prometheus at this retention cannot answer that question, and pretending otherwise here would be misleading.",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 16 },
          "targets": [{ "expr": "sum(rate(orders_total[1m])) * 60" }]
        }
      ]
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: ecom
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        runAsGroup: 472
        fsGroup: 472
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: grafana
          image: grafana/grafana:11.4.0
          envFrom:
            - secretRef: { name: grafana-admin-secret }
          env:
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
          ports: [{ containerPort: 3000 }]
          volumeMounts:
            - { name: datasources, mountPath: /etc/grafana/provisioning/datasources }
            - { name: dashboard-provisioning, mountPath: /etc/grafana/provisioning/dashboards }
            - { name: dashboard-ecom, mountPath: /var/lib/grafana/dashboards }
            - { name: data, mountPath: /var/lib/grafana }
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          readinessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: 3000 }
            initialDelaySeconds: 20
            periodSeconds: 15
      volumes:
        - { name: datasources, configMap: { name: grafana-datasources } }
        - { name: dashboard-provisioning, configMap: { name: grafana-dashboard-provisioning } }
        - { name: dashboard-ecom, configMap: { name: grafana-dashboard-ecom } }
        - { name: data, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: ecom
spec:
  selector: { app: grafana }
  ports: [{ port: 3000, targetPort: 3000 }]
