apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: ecom
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: payment-service }
  template:
    metadata:
      labels: { app: payment-service }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: payment-service
          image: ecomd-payment-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8085 }, { containerPort: 9085 }]
          envFrom:
            - configMapRef: { name: common-config }
            - secretRef: { name: app-datasource-secret }
            - secretRef: { name: payment-service-oauth2-secret }
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://host.docker.internal:5432/ecommerce?currentSchema=payment_service" }
            - { name: SERVER_PORT, value: "8085" }
            # Phase 7: actuator/Prometheus on a separate plain-HTTP port
            # — see catalog-service.yaml for the full rationale.
            - { name: MANAGEMENT_SERVER_PORT, value: "9085" }
            # Keeps JVM heap inside the container's memory limit below —
            # same reasoning as the Dockerfile's JAVA_TOOL_OPTIONS, but
            # explicit here since the K8s memory limit (not the
            # container's cgroup default) is the real ceiling now.
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75.0" }
            # ADR-0002: enables common-lib's SPIFFE mTLS auto-config —
            # inbound Tomcat connector now requires a client SVID.
            - { name: SPIFFE_MTLS_ENABLED, value: "true" }
            # ServiceTokenProvider: internal (container-to-container)
            # Keycloak address — matches api-gateway's own
            # KEYCLOAK_TOKEN_URI, same LOCAL-DEV DEVIATION (Keycloak runs
            # as a standalone host container, not a K8s pod, per
            # k8s/base/configmap-common.yaml).
            - { name: KEYCLOAK_TOKEN_URI, value: "http://host.docker.internal:8090/realms/ecom/protocol/openid-connect/token" }
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - { name: spiffe-workload-api, mountPath: /spiffe-workload-api, readOnly: true }
          readinessProbe:
            tcpSocket: { port: 8085 }
            initialDelaySeconds: 100
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8085 }
            initialDelaySeconds: 220
            periodSeconds: 15
      volumes:
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: ecom
spec:
  selector: { app: payment-service }
  ports: [{ name: http, port: 8085, targetPort: 8085 }, { name: metrics, port: 9085, targetPort: 9085 }]
