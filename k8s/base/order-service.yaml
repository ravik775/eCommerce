apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: ecom
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: order-service }
  template:
    metadata:
      labels: { app: order-service }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: order-service
          image: ecomd-order-service:latest
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 8082 }, { containerPort: 9082 }]
          envFrom:
            - configMapRef: { name: common-config }
            - secretRef: { name: app-datasource-secret }
          env:
            - { name: SPRING_DATASOURCE_URL, value: "jdbc:postgresql://host.docker.internal:5432/ecommerce?currentSchema=order_service" }
            - { name: SERVER_PORT, value: "8082" }
            # Phase 7: actuator/Prometheus on a separate plain-HTTP port
            # — see catalog-service.yaml for the full rationale.
            - { name: MANAGEMENT_SERVER_PORT, value: "9082" }
            # Keeps JVM heap inside the container's memory limit below —
            # same reasoning as the Dockerfile's JAVA_TOOL_OPTIONS, but
            # explicit here since the K8s memory limit (not the
            # container's cgroup default) is the real ceiling now.
            - { name: JAVA_TOOL_OPTIONS, value: "-XX:MaxRAMPercentage=75.0" }
            # ADR-0002: enables common-lib's SPIFFE mTLS auto-config —
            # inbound Tomcat connector now requires a client SVID.
            - { name: SPIFFE_MTLS_ENABLED, value: "true" }
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            # ADR-0058: 500m throttled JVM cold-start (classloading/bean
            # init is CPU-bound) badly enough that liveness killed pods
            # mid-boot under a multi-service simultaneous restart —
            # confirmed live via docker stats showing this container
            # pinned at ~48% of its own limit throughout an 8+ minute
            # stall. Raised to 1000m; host has 12 CPUs, plenty of headroom
            # even with all 5 app services raised the same way.
            limits: { cpu: 1000m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
            # ADR-0020 claimed "restricted" Pod Security Standard but
            # never actually set this — closing that gap. Needs an
            # explicit writable /tmp (below): Tomcat's embedded work
            # dir and the JVM's default java.io.tmpdir both write
            # there; Spring Boot itself writes no other files at
            # runtime (stdout-only logging, no file appender).
            readOnlyRootFilesystem: true
          volumeMounts:
            - { name: spiffe-workload-api, mountPath: /spiffe-workload-api, readOnly: true }
            - { name: tmp, mountPath: /tmp }
          readinessProbe:
            tcpSocket: { port: 8082 }
            initialDelaySeconds: 100
            periodSeconds: 10
          livenessProbe:
            tcpSocket: { port: 8082 }
            # ADR-0058: widened alongside the CPU limit raise — a
            # genuinely-progressing-but-slow startup under host resource
            # pressure was being killed and forced to restart from zero,
            # amplifying the very slowness it was reacting to.
            # failureThreshold explicit (was defaulting to 3): now
            # tolerates up to 300 + 5*20 = 400s before giving up.
            initialDelaySeconds: 300
            periodSeconds: 20
            failureThreshold: 5
      volumes:
        - name: tmp
          emptyDir: {}
        - name: spiffe-workload-api
          csi:
            driver: csi.spiffe.io
            readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: ecom
spec:
  selector: { app: order-service }
  ports: [{ name: http, port: 8082, targetPort: 8082 }, { name: metrics, port: 9082, targetPort: 9082 }]
