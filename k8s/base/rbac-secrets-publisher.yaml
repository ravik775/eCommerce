# Separation of duties for secrets management (doc/architecture/12-secrets-management.md):
# this identity can publish a rotated credential (create/update
# SealedSecret objects) but has no access to the "secrets" resource at
# all — rotating a credential never requires being able to read another
# service's already-decrypted value. Viewing decrypted Secret objects
# stays cluster-admin-only (nothing here grants that).
#
# Bind a real operator/CI identity to this Role as needed — e.g. for a
# GitHub Actions runner via a kubeconfig scoped to this ServiceAccount's
# token, or a human teammate who shouldn't need full cluster-admin just
# to rotate a Postgres password. Not bound to anything by default here;
# this manifest only establishes the least-privilege shape.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: secrets-publisher
  namespace: ecom
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secrets-publisher
  namespace: ecom
rules:
  - apiGroups: ["bitnami.com"]
    resources: ["sealedsecrets"]
    verbs: ["create", "update", "get", "list", "watch"]
  # Deliberately no "secrets" resource grant — see file header.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secrets-publisher
  namespace: ecom
subjects:
  - kind: ServiceAccount
    name: secrets-publisher
    namespace: ecom
roleRef:
  kind: Role
  name: secrets-publisher
  apiGroup: rbac.authorization.k8s.io
