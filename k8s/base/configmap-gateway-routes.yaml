# K8s-native replacement for config-server's api-gateway.yml gateway
# route section (ADR-0008): lb://SERVICE-NAME (Eureka + Spring Cloud
# LoadBalancer) becomes a direct K8s Service DNS name — kube-proxy
# load-balances across a Service's endpoints on its own, so no client-side
# discovery/load-balancer library is needed in this environment. Mounted
# via SPRING_CONFIG_ADDITIONAL_LOCATION (see api-gateway.yaml Deployment)
# since Spring Cloud Gateway's nested route/filter structure isn't
# reasonably expressible as flat env vars.
apiVersion: v1
kind: ConfigMap
metadata:
  name: gateway-routes
  namespace: ecom
data:
  application.yaml: |
    spring:
      cloud:
        gateway:
          # A servlet backend's own CorrelationTraceFilter echoes
          # X-Correlation-Id/X-Trace-Id on ITS response with the same
          # value CorrelationTraceGatewayFilter already set on this
          # exchange — Spring Cloud Gateway's routing filter merges the
          # two by ADDING rather than replacing, producing a literal
          # "id, id" duplicate (found live via a browser fetch on a real
          # checkout call). RemoveResponseHeader would strip the header
          # entirely (both values share one key); DedupeResponseHeader
          # with RETAIN_UNIQUE is the built-in filter for exactly this
          # "two layers set the same header" case.
          default-filters:
            - name: DedupeResponseHeader
              args:
                name: X-Correlation-Id X-Trace-Id
                strategy: RETAIN_UNIQUE
          routes:
            - id: order-service
              # https, not http: order-service enforces inbound mTLS
              # (ADR-0002) — an http:// route hits its TLS-only connector
              # with plaintext and gets rejected. Same class of bug as
              # OrderServiceClient's original ORDER-SERVICE fix; found
              # live testing the gateway's order-service route directly
              # (catalog-service's routes already correctly use https://).
              uri: https://order-service:8082
              # Path=/order/** only, not the compound "/order/**,/order"
              # — found live: the combined predicate non-deterministically
              # 405'd POST (but not GET) to the bare "/order" literal, a
              # Spring Cloud Gateway route-matching quirk with combined
              # exact+wildcard Path patterns for non-GET methods. Two
              # separate route entries (this one for sub-paths, the
              # order-service-create one below for the bare create call)
              # avoids the ambiguity entirely.
              predicates:
                - Path=/order/**
              filters:
                # ADR-0051 (2026-08-16 correction, see that ADR's update):
                # a Retry filter was added here targeting the same
                # "certificate_expired"/handshake class of transient
                # SPIFFE rotation failure the rest of that ADR addresses —
                # removed again the same day after it caused a real,
                # live-reproduced crash. This route's CircuitBreaker
                # filter (below) unconditionally intercepts every
                # downstream failure and converts it into its own
                # controlled 503 fallback (OrderServiceFallback) before
                # any raw exception/502/504 could ever reach a Retry
                # filter positioned around it — so Retry here could only
                # ever see, and wrongly re-trigger a second pass on,
                # CircuitBreaker's OWN fallback response: found live as
                # "ServerHttpResponse already committed (503)" on
                # GET /order/customer/4. CircuitBreaker already owns
                # resilience for this specific route; loosening its
                # minimumNumberOfCalls (see resilience4j config below) is
                # the correct lever for reducing false-positive trips on
                # a single transient blip, not a Retry filter layered on
                # top of it. RewritePath, not StripPrefix=1: OrderController is
                # mapped at /orders (plural) on order-service, not root
                # — StripPrefix=1 would forward "/order" -> "" (root) and
                # "/order/5" -> "/5", neither of which OrderController
                # answers. Rewrites the gateway's public /order path onto
                # order-service's actual /orders mapping. Found live: the
                # first genuine gateway->order-service call (with
                # StripPrefix=1) tripped the CircuitBreaker fallback
                # instead of reaching OrderController at all — unlike
                # catalog's route, which happens to work because
                # CatalogController's /products base already matches what
                # StripPrefix=1 leaves behind for /catalog/**.
                - RewritePath=/order(?<remaining>.*), /orders${remaining}
                - TokenRelay=
                - name: CircuitBreaker
                  args:
                    name: orderCircuit
                    fallbackUri: forward:/fallback/order
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
            - id: order-service-create
              # Companion to the order-service route above: the bare
              # "/order" literal (POST — order creation), split into its
              # own route rather than combined into that route's Path
              # predicate. See that route's comment for why.
              uri: https://order-service:8082
              predicates:
                - Path=/order
              filters:
                - RewritePath=/order, /orders
                - TokenRelay=
                - name: CircuitBreaker
                  args:
                    name: orderCircuit
                    fallbackUri: forward:/fallback/order
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
            - id: catalog-service-admin
              # https, not http: catalog-service enforces inbound mTLS
              # (ADR-0002, SPIFFE_MTLS_ENABLED=true) — this gateway also
              # has SPIFFE_MTLS_ENABLED=true, so its proxy client
              # presents a valid client SVID on every hop here.
              uri: https://catalog-service:8083
              predicates:
                - Path=/catalog/**
                - Method=POST,PUT,DELETE
              filters:
                - name: Retry
                  args:
                    retries: 1
                    series: [SERVER_ERROR]
                    methods: [GET]
                    statuses: [BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT]
                - StripPrefix=1
                - TokenRelay=
                # Phase 8 provider feature: PROVIDER can create/edit/
                # delete their own products now, not just ADMIN — this
                # is only the coarse edge gate (any of the two roles get
                # past the gateway at all); catalog-service's own
                # ownership check (ProductService) is what actually
                # stops a PROVIDER from touching another provider's
                # product, same split of responsibility this filter's
                # own class Javadoc already documents.
                #
                # name/args form, NOT the `RequireRole=X,Y` shortcut
                # string: Spring Cloud Gateway's shortcut notation splits
                # on comma as the ARGUMENT delimiter (`Filter=arg1,arg2`),
                # and this factory only declares one positional field
                # ("role") — so the shortcut form silently drops every
                # role after the first. Found live via the ACCESS_DENIED
                # audit log line showing requiredRoles=[ROLE_ADMIN] only.
                #
                # ADR-0033: CATALOG_ADMIN, not the old catch-all ADMIN
                # (no longer operational) — PLATFORM_ADMIN is a Keycloak
                # composite role, so its JWT already carries CATALOG_ADMIN
                # via composite expansion and doesn't need listing here.
                - name: RequireRole
                  args:
                    role: CATALOG_ADMIN,PROVIDER
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
            - id: catalog-service-read
              # https, not http: catalog-service enforces inbound mTLS
              # (ADR-0002, SPIFFE_MTLS_ENABLED=true) — this gateway also
              # has SPIFFE_MTLS_ENABLED=true, so its proxy client
              # presents a valid client SVID on every hop here.
              uri: https://catalog-service:8083
              predicates:
                - Path=/catalog/**,/catalog
              filters:
                - name: Retry
                  args:
                    retries: 1
                    series: [SERVER_ERROR]
                    methods: [GET]
                    statuses: [BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT]
                - StripPrefix=1
                - TokenRelay=
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
            - id: user-service
              # https, not http: user-service enforces inbound mTLS
              # (ADR-0002), same reasoning as every other backend route
              # here.
              uri: https://user-service:8081
              # Path=/user/** only, not a compound "/user/**,/user" — see
              # order-service's route comment above for why (a live-found
              # Spring Cloud Gateway quirk with combined exact+wildcard
              # Path predicates on non-GET methods). Phase 8's only use
              # of this route is GET /user/me, a sub-path, so the
              # ambiguity doesn't even arise here — kept as a single
              # wildcard predicate anyway, for consistency and to not
              # reintroduce the same class of bug if a bare /user route
              # is ever added later.
              predicates:
                - Path=/user/**
              filters:
                # ADR-0051: this route's only real traffic is GET
                # /user/me (see the Path comment above), so an
                # unqualified methods:[GET] restriction costs nothing
                # while keeping the same non-idempotent-write safety
                # rule as every other Retry filter in this file.
                - name: Retry
                  args:
                    retries: 1
                    series: [SERVER_ERROR]
                    methods: [GET]
                    statuses: [BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT]
                - RewritePath=/user(?<remaining>.*), /users${remaining}
                - TokenRelay=
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
            - id: inventory-service
              # https, not http: inventory-service enforces inbound mTLS
              # (ADR-0002), same as every other backend route here. No
              # RewritePath/StripPrefix: InventoryController is mapped
              # at /inventory (matching the gateway's own public path
              # exactly), unlike order/user which needed a rewrite.
              uri: https://inventory-service:8084
              predicates:
                - Path=/inventory/**
              filters:
                # ADR-0051: this route carries both reads and
                # INVENTORY_ADMIN/PROVIDER writes (see RequireRole
                # below), so — unlike order/user/catalog-read above,
                # which are GET-only routes — methods:[GET] here matters:
                # it's the only thing stopping a write (adjust stock,
                # etc.) from ever being replayed on a transient failure.
                - name: Retry
                  args:
                    retries: 1
                    series: [SERVER_ERROR]
                    methods: [GET]
                    statuses: [BAD_GATEWAY, SERVICE_UNAVAILABLE, GATEWAY_TIMEOUT]
                - TokenRelay=
                # See catalog-service-admin route above for why this must
                # be the name/args form, not the comma-shortcut string.
                # ADR-0033: INVENTORY_ADMIN, not ADMIN.
                - name: RequireRole
                  args:
                    role: INVENTORY_ADMIN,PROVIDER
                - name: RequestRateLimiter
                  args:
                    key-resolver: "#{@userKeyResolver}"
                    redis-rate-limiter.replenishRate: 5
                    redis-rate-limiter.burstCapacity: 10
            - id: ui
              # Catch-all, deliberately LAST in this route list — Spring
              # Cloud Gateway tries routes in declaration order, so every
              # more specific route above (/order, /catalog, /user) still
              # wins first; this only catches what's left (/, /app.js,
              # /style.css — the UI's own static files). Plain http, not
              # https: the UI container is static nginx, never enforced
              # inbound mTLS (ADR-0002's inbound wiring is a
              # servlet/Tomcat concern, not applicable here). Same origin
              # as every API route (this gateway's own port) is the
              # whole point — the UI's fetch() calls to /catalog, /order,
              # /user ride the same session cookie with zero CORS
              # handling needed, per ADR-0005's BFF pattern.
              uri: http://ui:8080
              predicates:
                - Path=/**
              filters:
                - TokenRelay=
    resilience4j:
      circuitbreaker:
        instances:
          orderCircuit:
            slidingWindowType: COUNT_BASED
            # ADR-0051 (2026-08-16 correction): was 2/2 — a single failed
            # call out of a 2-call window is a 50% failure rate, so any
            # one transient blip (the SPIFFE rotation class of failure
            # this ADR investigates, among others) tripped the breaker
            # for the full 30s open-state window, serving every checkout
            # attempt a 503 fallback even though order-service itself
            # was healthy again immediately after. 6/6 requires a real,
            # sustained failure pattern (3+ of the last 6 calls) before
            # opening, while still catching genuine outages well within
            # this system's actual traffic volume (ADR-0036's capacity
            # planning: 20 active users, nowhere near enough concurrent
            # checkout traffic for 6 calls to take long to accumulate).
            slidingWindowSize: 6
            minimumNumberOfCalls: 6
            failureRateThreshold: 50
            waitDurationInOpenState: 30s
      timelimiter:
        instances:
          orderCircuit:
            # ADR-0051 follow-up (2026-08-17): no timelimiter config
            # existed here at all, so Resilience4j's own default applied
            # — 1 second. Found live: a real POST /order succeeded on
            # order-service (confirmed via its own ORDER_CREATED audit
            # line matching the gateway's correlation ID) but took ~13s
            # end to end, since it was the first request that pod handled
            # after a restart — Spring MVC lazily initializes
            # DispatcherServlet on first use, plus first-time JPA query
            # compilation and Kafka producer setup, all landing on one
            # unlucky request. The 1s timeout gave up long before that
            # finished, CircuitBreaker reported it as a failed call and
            # served its 503 fallback, and the user — reasonably, having
            # been told it failed — retried, each retry using a fresh
            # Idempotency-Key (ui/src/app.js generates one per checkout
            # click by design, so IdempotencyService correctly treated
            # each as a genuinely new order) and therefore each retry
            # ALSO succeeding: 5 near-identical orders were created this
            # way in under 3 seconds. Not an idempotency bug — the
            # idempotency layer did exactly what it's supposed to; the
            # false failure signal is what made retrying look necessary.
            # 10s gives real headroom over both steady-state latency and
            # the worst-case cold-start case observed live, while still
            # bounding how long a client waits for a genuinely stuck
            # backend before the breaker's own accounting kicks in.
            timeoutDuration: 10s
